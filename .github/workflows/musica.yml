name: Ajouter la musique

# Se lance tout seul quand tu ajoutes des musiques dans le dossier musica/ (ou à la main, onglet Actions).
on:
  push:
    paths:
      - "musica/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escritura-repo
  cancel-in-progress: false

jobs:
  musica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Mixer la musique
        run: python3 poner_musica.py

      - name: Enregistrer les Reels avec musique
        run: |
          git config user.name "bot-publicador"
          git config user.email "bot@users.noreply.github.com"
          git add -A posts cola.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Musique ajoutée"
          git pull --rebase
          git push
