name: Fabriquer les épingles Pinterest

# Se lance à la main (onglet Actions → Fabriquer les épingles Pinterest → Run workflow).
# Crée les images de pines/ et les fichiers pinterest_mois1.csv, pinterest_mois2.csv…
# (ou pinterest_prueba.csv avec 3 épingles si « Essai » est coché).
on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Premier jour de publication (AAAA-MM-JJ). Vide = demain"
        default: ""
        required: false
      prueba:
        description: "Essai avec 3 épingles"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: escritura-repo
  cancel-in-progress: false

jobs:
  pines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils
        run: pip install --quiet pillow numpy

      - name: Fabriquer les épingles
        env:
          INICIO: ${{ inputs.inicio }}
          PRUEBA: ${{ inputs.prueba }}
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          BASE="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          ARGS=(--base "$BASE")
          [ -n "$INICIO" ] && ARGS+=(--inicio "$INICIO")
          [ "$PRUEBA" = "true" ] && ARGS+=(--prueba)
          cd fabrica && python3 pines.py "${ARGS[@]}"

      - name: Enregistrer
        run: |
          git config user.name "bot-publicador"
          git config user.email "bot@users.noreply.github.com"
          git add pines pinterest_*.csv
          git commit -m "Épingles Pinterest" || exit 0
          git pull --rebase
          git push
