name: Publier sur Instagram

on:
  schedule:
    # Réveil toutes les 30 minutes : le robot ne publie qu'aux créneaux de Paris
    # (8 h 12, 13 h 12, 19 h 12, 21 h 42), même si GitHub le réveille en retard.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai sans publier (1 = essai, 0 = publier pour de vrai)"
        default: "1"
      auto:
        description: "Réveil automatique (1 = ne publie qu'aux créneaux ; utilisé par cron-job.org)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: escritura-repo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publier le Reel suivant
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          AUTO: ${{ (github.event_name == 'schedule' || github.event.inputs.auto == '1') && '1' || '0' }}
        run: python3 publicar.py

      - name: Enregistrer l'état de la file
        if: ${{ (github.event.inputs.dry_run || '0') != '1' }}
        run: |
          git config user.name "bot-publicador"
          git config user.email "bot@users.noreply.github.com"
          git add cola.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Publicado: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
