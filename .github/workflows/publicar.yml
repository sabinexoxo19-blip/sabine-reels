name: Publier sur Instagram

on:
  schedule:
    # Réveil toutes les 30 minutes : le robot ne publie qu'aux créneaux de Paris
    # (8 h 12, 12 h 42, 20 h 12), même si GitHub le réveille en retard.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai sans publier (1 = essai, 0 = publier pour de vrai)"
        default: "1"
      auto:
        description: "Réveil automatique (1 = ne publie qu'aux créneaux ; utilisé par cron-job.org)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: escritura-repo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # état le plus récent de la file (un réveil mis en attente ne relit pas une file périmée)

      - name: Publier le Reel suivant
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          AUTO: ${{ (github.event_name == 'schedule' || github.event.inputs.auto == '1') && '1' || '0' }}
        run: python3 publicar.py

      - name: Publier le Short YouTube
        if: ${{ always() }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          AUTO: ${{ (github.event_name == 'schedule' || github.event.inputs.auto == '1') && '1' || '0' }}
        run: python3 publicar_youtube.py

      - name: Enregistrer l'état de la file
        if: ${{ always() && (github.event.inputs.dry_run || '0') != '1' }}
        run: |
          git config user.name "bot-publicador"
          git config user.email "bot@users.noreply.github.com"
          git add cola_livre.json cola_youtube.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Publicado: $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git pull --rebase; then
            git rebase --abort
            echo "Un autre réveil a déjà enregistré la file : rien à ajouter."
            exit 0
          fi
          git push
